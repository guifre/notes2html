name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff

      - name: Run lint
        run: python -m ruff check .

      - name: Check syntax warnings
        run: python -W error::SyntaxWarning -m py_compile notes2html.py test_notes2html.py

      - name: Run tests
        run: python -m unittest discover
